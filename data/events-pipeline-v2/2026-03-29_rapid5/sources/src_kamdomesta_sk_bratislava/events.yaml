- id: evt_20260331_src_kamdomesta_sk_bratislava_zdroj_muzeumpezinok_sk_v_stavy_v_stava_ornament_nahl_si_podu
  title: 'Zdroj: Muzeumpezinok.sk Výstavy > Výstava Ornament Nahlásiť podujatie -
    30.08.2026 Organizátor neuvedený Pezinok, Malokarpatské múzeum Utorok Kúpiť lístok
    Iné termíny Základy ornamentu možno hľadať v symbolike a mágii. Človek sa cítil
    byť v minulosti silne previazaný s prírodou, čo sa odzrkadľovalo v jeho snahách
    vysvetliť tajomné a skryté veci pomocou predstavivosti, obrazotvornosti a fantázie.
    Je zaujímavé, že napriek vývoju viaceré z týchto magických symbolov pretrvali
    stáročia až tisícročia. Ľudová dekoratívna kultúra má viacero vrstiev. Najstaršie
    prvky v nej bývajú prekryté a spájané s modernejšími, zdobnejšími. Pritom tieto
    staršie napríklad geometrické prvky – línie, pásy, zuby, meandre, kosoštvorce,
    kruhy a ďalšie sa objavovali už v neolite. Vzostup ornamentálnej výzdoby nastal
    v Európskych krajinách v prvej polovici 19. storočia, avšak zatiaľ čo v západnej
    Európe bol vplyvom industrializácie už koncom 19. storočia vytláčaný, tak v podmienkach
    strednej Európy a Slovenska pretrval ešte aj v prvej polovici 20. storočia. Ornament
    možno charakterizovať ako ozdobu, ktorá doplňuje a okrášľuje predmet. Okrem samotného
    významu symboliky ornamentov tieto predmetu dodávajú aj vizuálnu jedinečnosť a
    ľahkú identifikovateľnosť. Portál www.kamdomesta.sk nie je organizátorom uverejňovaných
    podujatí a preto nezodpovedá za zmeny uskutočnené organizátormi. Odporúčame preveriť
    si vopred termín a čas konania podujatia priamo u organizátora. Na niektoré akcie
