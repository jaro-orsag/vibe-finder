    alebo (c) poskytovaniu osobných údajov v rozsahu – titul, meno, priezvisko a adresa
    – na účely priameho marketingu. 9.4 Používateľ berie na vedomie, že spoločnosť
    spracúva osobné údaje, ktoré používateľ zadá do svojho používateľského konta za
    účelom poskytovania služby používateľovi v zmysle týchto všeobecných obchodných
    podmienok. Používateľ berie tiež na vedomie, že spoločnosť môže poveriť spracúvaním
    osobných údajov ďalších sprostredkovateľov. Používateľ má tiež právo informovať
    sa u spoločnosti, ktorým sprostredkovateľom boli jeho údaje poskytnuté. 9.5 Spoločnosť
    v prípade, ak spracúva osobné údaje pri poskytovaní služby pre návštevníka a/alebo
    používateľa, koná tak najmä v postavení sprostredkovateľa v zmysle zákona o ochrane
    osobných údajov. Návštevník a/alebo používateľ sú pri využívaní služby primárne
    a najmä v postavení prevádzkovateľa v zmysle zákona o ochrane osobných údajov.
    9.6 Spoločnosť spracúva osobné údaje výlučne za účelom poskytovania služby pre
    používateľa v zmysle týchto všeobecných obchodných podmienok. Predmetom spracovania
    osobných údajov sú najmä osobné údaje klientov používateľov, ktoré poskytuje používateľ
    spoločnosti za účelom využívania služby spoločnosti (týmito môže byť meno a priezvisko,
    adresa a iné v rozsahu, v akom ich používateľ poskytne spoločnosti). Osobné údaje,
    ktoré spracúva spoločnosť pre používateľa nie sú osobnými údajmi týkajúcimi sa
    zdravia, biometrickými údajmi, genetickými údajmi ani osobnými údajmi týkajúcimi
    sa rozsudkov v trestných veciach alebo trestných činov v zmysle zákona o ochrane
    osobných údajov. 9.7 Spoločnosť zachováva mlčanlivosť o všetkých údajoch a osobných
    údajoch, ktoré používateľ zadá do používateľského konta. V prípade, ak spoločnosť
    poverí ďalšie osoby spracovaním osobných údajov, deje sa tak len za účelom poskytovania
    služby v zmysle týchto všeobecných obchodných podmienok. Tieto osoby budú zároveň
    povinné rovnako dodržiavať mlčanlivosť ako spoločnosť vo vzťahu k údajom resp.
    osobným údajom, ktoré používateľ spoločnosti poskytol. Tieto osoby sú povinné
    riadiť sa pri vykonávaní svojej činnosti okrem iného aj týmito všeobecnými obchodnými
    podmienkami. 9.8 Spoločnosť za účelom zabezpečenia bezpečnosti spracúvania osobných
    údajov prijala so zreteľom na najnovšie poznatky, na náklady na vykonanie opatrení,
    na povahu, rozsah, kontext a účel spracúvania osobných údajov a na riziká s rôznou
    pravdepodobnosťou a závažnosťou pre práva dotknutých osôb primerané technické
    a organizačné opatrenia na zaistenie úrovne bezpečnosti primeranej tomuto riziku.
    Používateľ má právo informovať sa u spoločnosti o prijatých bezpečnostných a technických
    opatreniach podľa tohto bodu všeobecných obchodných podmienok. 9.9 Spoločnosť
    po zohľadnení povahy a rozsahu spracúvania osobných údajov pre konkrétneho používateľa
    môže poskytnúť súčinnosť používateľovi vhodnými technickými a organizačnými opatreniami
    pri plnení povinností prevádzkovateľa voči dotknutým osobám. Takouto súčinnosťou
    môže byť najmä poskytnutie služby zákazníckeho servisu. Obdobne poskytne spoločnosť
    súčinnosť používateľovi ohľadom použitých bezpečnostných a technických opatreniach,
    ktorými spoločnosť zaisťuje bezpečnosť spracúvania údajov resp. osobných údajov.
    Spoločnosť tiež poskytne používateľovi informácie potrebné na preukázanie splnenia
    povinností a poskytne súčinnosť v nevyhnutnom rozsahu v rámci auditu ochrany osobných
    údajov a kontroly zo strany používateľa alebo audítora povereného používateľom.
    10. INFORMÁCIE PRE SPOTREBITEĽOV 10.1 Reklamácie služby poskytovanej spoločnosťou
    a sťažnosti a podnety spotrebiteľov je možné uplatniť osobne v sídle spoločnosti
    alebo elektronicky na adrese: marketing@kamdomesta.sk. Ceny služieb poskytovaných
    spoločnosťou sú uvedené v cenníku služieb dostupnom na adrese: http://www.kamdomesta.sk/na-stiahnutie/.
    Spotrebiteľ je v súlade s ust. § 7 zákona č. 102/2014 Z. z. o ochrane spotrebiteľa
    v znení neskorších predpisov pri predaji tovaru alebo poskytovaní služieb na základe
    zmluvy uzavretej na diaľku alebo zmluvy uzavretej mimo prevádzkových priestorov
    predávajúceho, v platnom znení, oprávnený odstúpiť od zmluvy o poskytovaní služby
    aj bez uvedenia dôvodu do 14 dní odo dňa jej uzatvorenia. Oznámenie o odstúpení
    od zmluvy doručí spotrebiteľ spoločnosti formou doporučenej zásielky na adresu
    sídla spoločnosti. Spoločnosť začne s poskytovaním služby po úhrade ceny zvolenej
    služby spotrebiteľom, t.j. služba je spotrebiteľovi poskytovaná aj v období pred
    uplynutím lehoty na odstúpenie od zmluvy. Uhradením ceny zvolenej služby spotrebiteľ
    vyjadruje svoj súhlas so začatím poskytovania služby pred uplynutím lehoty na
    odstúpenie od zmluvy. Spoločnosť výslovne uvádza, že v prípade odstúpenia od zmluvy
    je spotrebiteľ povinný uhradiť spoločnosti iba cenu za skutočne poskytnuté plnenie
    do dňa doručenia oznámenia o odstúpení od zmluvy. Uhradená cena za službu v časti
    prevyšujúcej cenu skutočne poskytnutého plnenia bude spotrebiteľovi vrátená do
    14 dní odo dňa doručenia oznámenia o odstúpení od zmluvy. Spoločnosť zodpovedá
    za vady poskytovanej služby v súlade s príslušnými ustanoveniami Občianskeho zákonníka.
    11. RIEŠENIE SPOROV, ALTERNATÍVNE RIEŠENIE SPOROV 11.1 Účastníci právneho vzťahu
    podľa týchto všeobecných obchodných podmienok sa zaväzujú prijať všetky dostupné
    opatrenia pre konkrétne riešenie akýchkoľvek nezhôd a sporov, ktoré môžu vzniknúť
    z neplnenia povinností povinnej osoby a vzniknutú situáciu riešiť vzájomným zmierom.
    Spory, ktoré by mohli vzniknúť v dôsledku neplnenia povinností podľa týchto všeobecných
    obchodných podmienok budú predmetom konania pred príslušnými všeobecnými súdmi
    Slovenskej republiky. 11.2 Okrem vyššie uvedeného má používateľ možnosť za účelom
    riešenia sporov medzi spoločnosťou a používateľom využiť alternatívne riešenie
    sporov. Alternatívnym riešením sporu je postup subjektu alternatívneho riešenia
    sporov, ktorého cieľom je dosiahnutie zmierlivého vyriešenia sporu medzi jeho
    stranami, t.j. medzi spoločnosťou a používateľom. 11.3 Príslušným orgánom (subjektom)
    alternatívneho riešenia sporov je v zmysle všeobecne záväzných právnych predpisov
    Slovenská obchodná inšpekcia, na ktorú sa môže spotrebiteľ obrátiť alebo iný subjekt,
    ktorý sa nachádza v zozname subjektov alternatívneho riešenia sporov zverejnený
    na stránke Ministerstva hospodárstva SR – http://www.mhsr.sk 11.4 Spotrebiteľ
    sa môže o podmienkach a platforme alternatívneho riešenia sporov informovať na:
    http://www.soi.sk/sk/Alternativne-riesenie-spotrebitelskych-sporov.soi 11.5 Spotrebiteľ
    môže spor medzi ním a spoločnosťou riešiť aj prostredníctvom ODR platformy. Spotrebiteľ
