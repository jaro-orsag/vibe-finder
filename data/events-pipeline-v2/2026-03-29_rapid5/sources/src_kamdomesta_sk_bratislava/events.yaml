- id: evt_20260421_src_kamdomesta_sk_bratislava_zdroj_djgt_sk_predstavenia_pre_deti_pom_pomove_rozpr_vky_nah
  title: 'Zdroj: Djgt.sk Predstavenia > Pre deti > POM POMOVE ROZPRÁVKY Nahlásiť podujatie
    Organizátor neuvedený Zvolen, Divadlo J. G. Tajovského Utorok , 10:00 Kúpiť lístok
    Kto je Pom Pom? Občas vyzerá ako brmbolec, občas ako parochňa a občas ako klbko
    vlny. Dievčatku Babuli stihne cestou do školy predstaviť Artúra Buchtu, Gumovacieho
    pavúka aj Hodinovú Skočpružinu, ktorá sa záhadne stratí z vežových hodín. Celé
    mesto preto žije v popletenom čase, až kým sa Pom Pom s Babuľou nepodujmú nájsť
    riešenie. POM POMOVE ROZPRÁVKY sú kultovým dielom maďarského autora Istvána Csukása.
    Sú známe originálnou fantáziou, láskavým humorom, podporou priateľstva a nezdolným
    optimizmom, že všetko v živote sa dá napraviť, len treba nájsť spôsob ako. Obyčajné
    dievčatko Babuľa spozná neobyčajné veci vďaka kamarátovi Pom Pomovi, ktorý ju
    cestou do školy prenesie do farebného sveta. Dramatizácia režiséra Petra Palika
    spája viaceré rozprávky do jedného pútavého dobrodružného príbehu. Niektoré z
    postáv spoznajú deti v okúzľujúcej bábkovej podobe a celý vizuál rozprávky je
    vďaka výtvarníčkam Nadi Salbotovej a Martine Fintorovej veľmi pôsobivý. Zážitok
    dopĺňajú piesne hudobníkov Martina Geišberga a Daniela Špinera. Rozprávka je určená
    pre deti vo veku od 4 rokov, ktoré budú vtiahnuté do imaginatívneho sveta fantázie
    a zažijú autentický divadelný zážitok plný hravosti. Horná veková hranica je neobmedzená.
    / Odporúčame: 4+ / Dľžka predstavenia: 60 min bez prestávky Portál www.kamdomesta.sk
