- id: evt_20260329_src_kamdomesta_sk_bratislava_zdroj_gal_ria_nedbalka_kurzy_tanec_tetca_workshop_kaligrafic
  title: 'Zdroj: Galéria Nedbalka Kurzy > Tanec štetca - workshop kaligrafickej maľby
    Nahlásiť podujatie Galéria Nedbalka Bratislava-Staré Mesto, Galéria Nedbalka Nedeľa
    , 14:00 Kúpiť lístok Objavte poetiku maľby, ktorá je inšpirovaná zenovým umením
    – spája gesto, intuíciu a symboliku v prítomnom okamihu. Zoznámime sa s tradičnými
    pomôckami: kaligrafickým štetcom, tušom a papierom – aj s princípmi zenovej maľby
    a životného štýlu, ktorý je inšpiráciou do nášho uponáhľaného sveta. V praktickej
    časti si vyskúšate dobrodružstvo experimentu a spolupráce, ponorenie do vlastného
    sveta imaginácie a vytvoríte si sériu autorských obrázkov. Workshop je spojením
    estetického zážitku, inšpirácie, relaxu ale aj príležitosťou pre sebakultiváciu.
    Vhodný aj pre začiatočníkov v maľbe či kaligrafii. Trvanie: 2,5 – 3 hod Cena kurzu:
    55 € Termín: 29.3.2026 (nedeľa) 14.00 – 17.00 h Lektorka: Pawla Šoltisová – výtvarníčka
    a pedagogička, v Ateliéri Amulet lektoruje kurzy výtvarných techník a kaligrafie.
    Vo svojej voľnej tvorbe prepája západnú a východnú kaligrafiu, grafiku, maľbu
    a koláž. Portál www.kamdomesta.sk nie je organizátorom uverejňovaných podujatí
