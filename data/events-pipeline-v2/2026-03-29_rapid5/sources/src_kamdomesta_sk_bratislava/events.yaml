- id: evt_20260329_src_kamdomesta_sk_bratislava_zdroj_ticketportal_sk_port_hk_dukla_michalovce_hk_nitra_nahl
  title: 'Zdroj: Ticketportal.sk Šport > HK Dukla Michalovce - HK Nitra Nahlásiť podujatie
    Organizátor neuvedený Michalovce, Zimný štadión Michalovce Nedeľa , 17:30 Kúpiť
    lístok Upozornenie pre fanúšikov súpera, ktorí cestujú individuálne, aby si kupovali
    miesta v sektore A5. Fanúšikovia, ktorí cestujú organizovane ako fanklub súpera
    budú mať miesta pod sektorom A5 - označený ako HOSTIA STÁTIE - môžu si zakúpiť
    iba ak sú nahlásení ako oficiálny výjazd. Do sektoru HOSTIA STÁTIE nebudú okrem
    nahláseného zoznamu iní fanúšikovia vpustení. Druhé upozornenie je pre fanúšikov
    MI. Lístky zakúpené do sektora B1 sú s obmedzením, že sa jedná o domáci sektor
    fans, kde sa hlasno povzbudzuje, bubnuje a máva s vlajkami. Výhľad a celkový komfort
    je preto obmedzený. *Imobilní fanúšikovia (aj jeden doprovod) majú vstup zadarmo.
    Bezbariérový vstup označený ako VIP vstup skyboxy. Organizačný a návštevný poriadok
    HK Dukla Michalovce 1. Vstup je povolený len v prevádzkovej dobe s platnou vstupenkou,
    ktorou je návštevník povinný sa preukázať na požiadanie usporiadateľa. 2. Zákaz
    vstupu platí pre osoby pod vplyvom alkoholu alebo iných omamných látok. 3. Vstup
    do priestorov štadiónu HK Dukla Michalovce môže byť odopretý osobám, ktorých návšteva
    by narušila alebo mohla narušiť poriadok a bezpečnosť športového podujatia, resp.
    ich správanie sa je v rozpore so spoločenskými normami správania. 4. Vstup zvierat
    na štadión HK Dukla Michalovce je zakázaný. 5. Je prísne zakázané vnášať na štadión
    HK Dukla Michalovce nápoje, jedlo, omamné a psychotropné látky. 6. Pre návštevníkov
    platí zákaz vnášania zbraní, streliva, pyrotechniky, dáždnikov a iných predmetov,
    ktoré môžu alebo by mohli ohroziť život alebo zdravie osôb alebo spôsobiť na zariadení
    a vybavení štadiónu HK Dukla Michalovce. 7. Pri vstupe do štadiónu HK Dukla Michalovce
    sú vykonávané bezpečnostné prehliadky. Návštevník je povinný podrobiť sa týmto
    prehliadkam v potrebnom rozsahu a tieto prehliadky strpieť. Odmietnutie prehliadky
    môže v dôvodných prípadoch viesť k zamedzeniu vstupu návštevníkovi respektíve
    vyvedenie z priestorov štadiónu HK Dukla Michalovce. 8. Návštevníci sú povinní
    správať sa v priestoroch štadiónu HK Dukla Michalovce spôsobom, ktorý nepoškodzuje
    alebo iným spôsobom neznehodnocuje majetok štadiónu HK Dukla Michalovce. 9. Návštevník
    je povinný uhradiť HK Dukla Michalovce všetky škody, ktoré spôsobí svojim konaním.
    10. Návštevníci sú povinní udržovať v priestoroch štadiónu HK Dukla Michalovce
    čistotu a poriadok. 11. Vo všetkých priestoroch štadiónu HK Dukla Michalovce je
    prísny zákaz fajčenia. 12. Je zakázané vhadzovať akékoľvek predmety na ľadovú
    plochu počas športových, spoločenských, kultúrnych alebo iných akcií, ako i po
    nich. 13. Pred vstupom na štadión HK Dukla Michalovce ako aj v jeho priestoroch
    platí zákaz odkladania bicyklov, malých motocyklov. 14. Návštevníci sú oprávnení
    pohybovať sa na štadióne HK Dukla Michalovce len v priestoroch vyhradených pre
    návštevníkov. Vstup do iných priestorov je prísne zakázaný. 15. Za zranenia osoby
    v publiku súvisiace s akciou puk atď. HK Dukla Michalovce nezodpovedá. 16. HK
    Dukla Michalovce nezodpovedá za škody, poranenia alebo úrazy spôsobené neopatrnosťou
    alebo nedodržaním organizačného a návštevného poriadku a tiež pokynov zodpovedných
    zamestnancov. Všetky škody spôsobené na štadióne HK Dukla Michalovce, správaním
    a konaním návštevníkov v rozpore s týmto návštevným poriadkom budú HK Dukla Michalovce
    vymáhané podľa právnych predpisov SR. 17. Ustanovenia organizačného a návštevného
    poriadku sú platné pre celý objekt štadiónu HK Dukla Michalovce vrátane parkovacích
    priestorov a iných priestorov a objektov patriacich štadiónu HK Dukla Michalovce.
    18. Návštevníci športového podujatia na štadióne HK Dukla Michalovce sú povinní
    dodržiavať predpis č 1/2014 Z.z. o organizovaní verejných športových podujatí.
    19. Člen usporiadateľskej služby podujatia môže vyzvať diváka na opustenie štadióna,
    ak po upozornení členom usporiadateľskej služby pokračuje v nevhodnom správaní
    alebo konaní, alebo ak sa odmietne podriadiť výzve na premiestnenie do príslušného
    sektoru vyčleneného pre priaznivcov družstva, ktoré podporuje. 20. Člen usporiadateľskej
    služby podujatia môže vyviesť diváka a zakázať jeho ďalšiu účasť na športovom
    podujatí , ak: a) po upozornení pokračuje v nevhodnom správaní sa, porušuje verejný
    poriadok alebo narušuje pokojný priebeh športové podujatie alebo b) neuposlúchol
    pokyn na premiestnenie do príslušného sektoru vyčleneného pre priaznivcov družstva,
    ktoré podporuje. Portál www.kamdomesta.sk nie je organizátorom uverejňovaných
