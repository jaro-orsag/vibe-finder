- id: evt_20260329_src_kamdomesta_sk_bratislava_zdroj_goout_net_v_stavy_dizajn_sk_nahl_si_podujatie_31_12_20
  title: 'Zdroj: Goout.net Výstavy > dizajn.sk Nahlásiť podujatie - 31.12.2026 Organizátor
    neuvedený Bratislava-Staré Mesto, Slovenské múzeum dizajnu Nedeľa Kúpiť lístok
    Iné termíny Múzeum dizajnu otvára historicky druhú expozíciu slovenského dizajnu.
    Expozícia dizajn.sk predstavuje kurátorský výber reprezentatívnych, nadčasových
    a unikátnych diel slovenského dizajnu 20. a 21. storočia najmä zo zbierok Slovenského
    múzea dizajnu. Základným motívom výstavy sú príbehy slovenského dizajnu, rozprávané
    cez jednotlivé diela z najrôznejších sfér dizajnu. Odhaľujú fragmenty tvorivých
    procesov a myšlienok autorov a autoriek odvíjajúcich sa na pozadí doby. Nosným
    prvkom expozície je výstavný systém zložený zo sústavy upcyklovaných lightboxov,
    ktoré, aj v prenesenom význame, osvetľujú ikonické diela slovenského dizajnu.
    „Pestré dejiny dizajnu na Slovensku ešte stále dokážu prekvapiť zabudnutým prototypom,
    ručne spracovaným návrhom plagátu alebo nákresom výrobku, ktorý sa nikdy nedostal
    do sériovej výroby. Súčasný slovenský dizajn a úžitkové umenie úspešne prezentujú
    nové cesty k vlastnej identite a zároveň reflektujú aktuálne spoločenské témy.
    Svoju budúcnosť profilujú na technologických inováciách a najnovších možnostiach
    experimentovania s tvorivým potenciálom, tvarom a materiálom,“ povedal Mgr. art.
    Maroš Schmidt, riaditeľ Slovenského centra dizajnu. Dizajn je živý organizmus,
    ktorý sa neustále mení, rastie a rozvíja. Charakteristickou vlastnosťou novej
    expozície v Múzeu dizajnu je výstavná dynamika, vďaka ktorej môžeme v neveľkých
    priestoroch priebežnou obmenou exponátov prezentovať aj najnovšie akvizície a
    diela rezonujúce v Národnej cene za dizajn či reagovať na výročia významných osobností
    slovenského dizajnu. „Podpora dizajnu je pre nás investíciou do kultúrneho dedičstva
    aj kreatívnej budúcnosti, ktoré významne formujú spoločnosť. Dizajn je každodennou
    súčasťou nášho života – ovplyvňuje, ako bývame, ako pracujeme aj ako sa cítime.
    Veríme, že výstava dizajn.sk bude pre návštevníkov nielen pohľadom do histórie,
    ale aj zdrojom inšpirácie, že slovenský dizajn má schopnosť tvoriť krásu aj funkčnosť
    v jednom,“ povedala riaditeľka J&T Banky na Slovensku Anna Macaláková. „Dizajn
    na Slovensku je tvorený nekonečným množstvom „malých“ príbehov - ideí, experimentov,
    rôznych osudov autorov a autoriek či výrobcov, ale aj ľudí, ktorí dizajn používajú,
    premýšľajú nad ním a žijú s dizajnom. V spleti týchto príbehov sa odrážajú aj
    príbehy „veľké“: rytmus doby, hlas spoločnosti a energia priestoru, v ktorom vznikajú.
    Naša expozícia je pozvánkou k počúvaniu a sledovaniu týchto rozprávaní – veríme,
    že takto sa história i súčasnosť dizajnu stanú súčasťou ďalších príbehov pre budúcnosť,“
    uviedla Mgr. Silvia Seneši Lutherová, PhD., zástupkyňa riaditeľa Slovenského centra
    dizajnu pre odborné záležitosti. V spolupráci s jednotlivými oddeleniami Slovenského
    centra dizajnu vystavené predmety ožívajú v expozícii a Klube dizajnu komentovanými
    prehliadkami, diskusiami s dizajnérmi a dizajnérkami, výrobcami, teoretikmi a
    teoretičkami dizajnu a tematicky bohatými sprievodnými podujatiami pre široké
    publikum. Ďalšie informácie a kontexty expozície dopĺňajú odborné časopisy a publikácie
    v Čitárni dizajnu a Knižnica materiálov Loma. Portál www.kamdomesta.sk nie je
    organizátorom uverejňovaných podujatí a preto nezodpovedá za zmeny uskutočnené
    organizátormi. Odporúčame preveriť si vopred termín a čas konania podujatia priamo
