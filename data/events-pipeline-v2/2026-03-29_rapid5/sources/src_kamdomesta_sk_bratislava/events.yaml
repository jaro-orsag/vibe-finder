- id: evt_20240104_src_kamdomesta_sk_bratislava_vzdali_ctu_zakladate_om_my_lienky_detsk_fam_zny_svet_oz_dfs_
  title: 'Vzdali úctu zakladateľom myšlienky Detský Famózny Svet (OZ DFS), pripravil
    v mesiaci októbri z úcty k starším Talkshow v DK Svit pod názvom „To najlepšie
    z nás, pre vás, od nás...“, ktoré sprevádzala Michala Gánovská pri príležitosti
    pripomenutia si historických medzníkov, členstva, projektov, vízie, kampane „BezUM
    mením na Rozum“, ktorá šíri informáciu o tom, že človek sa celý život učí a mení
    svoje myslenie na rozumné hodnoty našej spoločnosti a ocenili tých, ktorí sa zaslúžili
    o hlavnú myšlienku a založenia OZ DFS, ako náhradu za valné zhromaždenie pre oslovenie
    širokej verejnosti. OZ DFS je združenie na podporu detskej a mládežníckej umeleckej
    tvorivosti, ktoré prevzalo od zaniknutého MsKS Svit poslanie a šíri 25 rokov posolstvo
    kultúry a umenia vytvárajúce priestor pre záujmové útvary: DFS Jánošíček, TS Štýl,
    MS DFS, Impro, VytWor, Remeslarum, ale aj ďalších tradičných projektov v rámci
    organizovania festivalov, workshopov, kurzov na celoštátnej a medzinárodnej úrovni,
    život v komunite, osvety a propagácie. Plynúce roky zanechali niekoľko medzníkov
    formovania do dnešných podôb, pričom si pripomenuli tie najdôležitejšie. V roku
    2003 vznikla pri ZUŠ TS Štýl pre súčasný a moderný tanec prebratím žiakov od Ireny
    Janku p. uč. Vlastou Horňákovou, ktorí členovia nechceli byť v združení čo nesie
    folklórny názov a tak sa v roku 2006 združenie premenovalo z DFS Jánošíček o.z.
    na Detský Famózny Svet, aby mohlo vytvoriť väčší priestor pre všetkých, ktorí
    sa chcú realizovať v kultúre a umení. Neskôr takto prichýlilo v rámci spolupráce
    ĽH Bystrianku a pomáhalo mu v zbere 2% v rokoch 2007-08. V zbere 2% pomohlo aj
    Zábavnej skupine SVITTASENIOR v r.2009-2011 a v roku 2022 aj FS Senior Jánošík.
    Pre väčšiu transparentnosť prideľovania dotácií z mesta Svit sa po dohode s vedením
    OZ DFS odčlenila ĽH Bystrianka a vytvorila si vlastné občianske združenie, ktorým
    si zabezpečila prísun dotácii z mesta konkrétne na svoju činnosť. Pokiaľ by mesto
    zohľadnilo, že združenie združuje viac záujmových útvarov a prideľovalo by primerane
    dotáciu každému z nich na ich činnosť vytváranie nových združení by nebola potreba,
    ktoré za 25 rokov na území Svitu hojne pribudlo. Rok 2013 sa zapísal ďalším medzníkom
    a to odchodom p. uč. Vlasty Horňákovej zo ZUŠ Svit. Po 13-tich plodných rokoch
    výsledkov, ktoré v ZUŠ dosiahla, ju uvoľnili bez nároku na odstupné, čím na toto
    rozhodnutie nenamietala a prijala ho. Jej reakcia nebola slabosť, ale bolo to
    jej vyjadrenie vďaky za to, že jej ZUŠ dala príležitosť, aby mohla viesť DFS Jánošíček
    a TS Štýl vo svojom voľnom čase bez nároku finančnej odmeny za jej autorstvo.
    Jej odchod bol podmienený tým, že sa mali zároveň zmeniť podmienky fungovania
    DFS Jánošíček a TŠ Štýl, ktoré by neboli výhodné pre tieto telesa a za ktoré do
    dnešných čias nesie ako vedúca zodpovednosť. Zobrala svojich žiakov v oveľa menšom
    počte, s ktorými do ZUŠ prišla v roku 1999 a do dnešných dní spomínané súbory
    pracujú ako záujmové útvary Detský Famózny Svet. Tým je evidentné, že doposiaľ
    tieto súbory fungujú, hoci v obmedzenom režime, pretože v roku 2014 sa im časová
    dotácia prenájmu v DK Svit zmenila z 5 dní na 4 dni a neskôr na 2 dni. V súčasnosti,
    pokiaľ je potrebná realizácia s deťmi robiť priestorovú a súborovú prax na javisku,
    robia tak za poplatok 100€/deň. Táto skutočnosť je pre súbory OZ DFS Svit neprajná,
    pretože tieto súbory nevytvárajú celovečerné programy každoročne, kde by si mohli
    prax na javisku realizovať priebežne, ale len príležitostne vystupujú na akciách
    a podujatiach na ktoré ich iné organizácie pozývajú. Celovečerné programy usporadúvajú
    len v rámci svojho 5 ročného cyklu výročia, ktoré sú nekomerčné (a tak si nedokážu
    zabezpečiť príjmy z vystúpení s ktorými mesto ráta za prenájom priestorov javiska).
    Tieto celovečerné výročné programy sú podporované sponzormi a donormi, čím sa
    neznižuje ich kvalita. Finanční garanti garantujú, aby si toto ich vystúpenie
    mohli pozrieť všetci, aj tí, čo by si ich inak finančne dovoliť nemohli. Netreba
    ich porovnávať s činnosťou škôl, ktoré si vytvárajú celovečerné programy každoročne
    za vstupné. Nastáva tu situácia, kedy tieto súbory si nebudú môcť dovoliť vystupovať
    pre mesto Svit na jeho akciách a podujatiach, pretože budú vlastne platiť nepriamo
    za každú príležitosť takéhoto vystúpenia tým, že na prípravu svojho programu na
    javisku si musia za tieto priestory uhradiť 100€/deň za každé vystúpenie, ktoré
    odvystupuje pre mesto Svit. Situácia by sa zmenila, pokiaľ by združeniu bolo dovolené
    v zmluve o prenájme využiť 12x do roka v iné dni priestory javiska zdarma, kde
    by deti a mládež získavala odbornú a súborovú prax, tak ako to bolo do roku 2023.
    Táto spolupráca by mala byť podchytená zároveň v zmluve o bártrovej výmene a spolupráci,
    tak ako to prináleží organizáciám patriacim do kategórie osobitného zreteľa. V
    zmluve o prenájme by pomohla aj zmena, aby si priestory v DK Svit mohlo OZ DFS
    prenajímať napr. pre umelecké školy s ktorými by robilo spoluprácu v rámci pedagogiky
    výučby hudby, spevu, tanca, divadla, výtvarného odboru. Týchto pedagógov by potom
    platilo združenie DFS Svit za hodiny navyše, ktoré by vykonávali činnosť spolu
    s záujmovými útvarmi OZ DFS Svit. sa združeniu kriticky zmenšili priestory inventára
    šatnice - krojnice z výmery 8,85m2 na 2,065m2, pričom tento inventár zložený z
    krojov, kostýmov, techniky a hudobných nástrojov museli zakonzervovať do kufrov
    a dať mimo potreby súborov. V súčasnosti združenie potrebuje, aby inventár mohol
    byť v povolených skriniach DK Svit, pretože každý kto má doma skrine v ktorých
    má oblečenie pre svoju dennú potrebu sa nepovažuje za oblečenie uložené v skladových
    priestoroch, ale za dennú potrebu potrebnú pre život každého jedinca a to isté
    platí pre súbory, ktoré na vystúpenia potrebujú svoje kostýmy a kroje, hudobné
    nástroje, techniku, aby sa mohli pre svoje potreby prezentovať kedy to v danej
    situácii potrebujú. Pokiaľ takéto možnosti nemajú ich prezentácia na verejnosti
    je obmedzená. Tento medzník je hlavne pre detský folklórny súbor veľmi zlomový,
    nakoľko pokiaľ nebude môcť používať kroje t. j. hájiť pravdu tohto folklórneho
    obdobia, prejde pod ľudovú umeleckú tvorbu t. j. vymyslenú tvorbu (tak ako to
    mnohé súbory v súčasnosti už robia), čo je na škodu veci, nakoľko práve mesto
    Svit, bolo miestom, kde ľudia zmenili kroje za priemyselné oblečenie a folklórne
    súbory sú živým odkazom a múzeom, ktoré historicky pripomínajú toto obdobie. V
    tom istom roku tohto medzníka sa museli tieto zmeny zapracovať aj do stanov združenia,
    ktoré jasne deklarujú, že združenie vykonáva edukatívno-kultúrno-umelecké činnosti,
    umeleckého turizmu a rekreačného športu pre deti a mládež i dospelých, zamerané
    na pravidelnú edukačnú činnosť záujmových útvarov, realizáciou projektov v krátkodobých,
    dlhodobých, zahraničných, medzinárodných, zotavovacích i tradičných podujatiach
    a propagačno-publicistickej činnosti. Tieto činnosti sú pre DFS Jánošíček a TS
    Štýl rozvinuté v podporných útvaroch Impro, VytWor, Remeslarum a MS DFS i ostatných
    projektoch, ktoré im dopomáhajú v prezentáciách a reprezentáciách tak, aby mohli
    naďalej vykonávať svoje pôvodné zámery a ciele. Program Talkshow bol obohatený
    o vystúpenia účinkujúcich: Bc. Vlasta Horňákovej DiS.art. - predsedkyne a štatutárky
    združenia, manželov Oleny a Mikoly Kachurovcov - pedagógov SZUŠ Rosnička Č. Kláštor
    a laureátky Mega Talent Festivalu v Turč. Tepliciach, Aurory TOROZI - žiačky SŠ
    ZUŠ Poprad. Ocenením „Zaslúžilý čestný člen a významné uznanie“ si uctili v mesiaci
    úcty k starším autorov hlavnej myšlienky a podporovateľov združenia: Ladislav
    Havlik, Mgr. Pavol Šivec, Ján Halanda, Ing. Vladimír Rusnák in memoriam, Ing.
    Milan Fecko. Ocenenie „Zaslúžilý čestný člen a uznanie“ získali aj spoluzakladatelia:
    Dana Plučinská, Ľubomír Dikant a Dana Petriláková. Po skončení Talkshow bol pripravený
    priestor VIP zóny pre poďakovanie a osobné stretnutia so svojimi partnermi a podporovateľmi.
    V budúcom období sa budú robiť v rámci ďalších medzníkov podobné prezentácie,
    ktoré budú informovať svojich členov namiesto valného združenia oslovujúce verejnosť
    o činnosti a napredovaní združenia i jeho záujmových útvarov. Už v budúcom roku
    sa naskytne takáto príležitosť 30. výročia založenia DFS Jánošíček, ktorá by mala
    zmapovať jeho folklórnu cestu existencie. dfssvit Zdroj: OZ DFS Svit'
