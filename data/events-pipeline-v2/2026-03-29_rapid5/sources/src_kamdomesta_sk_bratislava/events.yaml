- id: evt_20260423_src_kamdomesta_sk_bratislava_zdroj_ticketportal_sk_predstavenia_sob_ny_list_nahl_si_poduj
  title: 'Zdroj: Ticketportal.sk Predstavenia > SOBÁŠNY LIST Nahlásiť podujatie Organizátor
    neuvedený Košice-Staré Mesto, Historická radnica Štvrtok , 19:00 Kúpiť lístok
    Svetový satirik a humorista, spisovateľ Ephraim Kishon sa narodil v Budapešti
    v Maďarsku pod menom Ferenc Hoffmann (23.8.1924 ) Od roku 1949 žil v Izraeli a
    zmenil si meno pod ktorým ho pozná celý svet (napísal okolo 50 diel a boli prekladané
    do viac ako 35 jazykov). V roku 1981 sa presťahoval do Švajčiarska a žil tam až
    do smrti v roku 2005. Po roku1989 sa objavujú jeho knihy a divadelné hry aj v
    Československu. Divadelná hra „Sobášny list“ je z prostredia obyčajnej židovskej
    rodiny, ktorá odišla z Kibucu niekedy v druhej polovici 20.storočia. Muž pracuje
    a je hrdý na to, že zarába dostatočne na to, aby jeho manželka nemusela pracovať.
    Tak sa to patrí. Majú dcéru súcu na vydaj. Má nápadníka, mamičkinho synáčika.
    Celý život už dospelého Viktora riadi mamička od obsahu jeho vreciek až po svadbu,
    všetko musí byť na sto percent v poriadku. Nastáva problém so sobášnym listom
    rodičov nevesty, ktorý sa stratil. Vzniká množstvo vtipných situácii medzi starými
    manželmi, vyplávajú na povrch dlhoročné priania a sny, ktoré sú konfrontované
    s realitou. E. Kishon s majstrovským vtipom rozmotáva klbko deja a zase ho majstrovsky
    zamotáva. Divák sa pobaví aj prekvapí zvratmi o osudoch do vtedy tak všedného
    a stereotypného života rodiny. Vzniká tu množstvo komických situácií, ktoré provokujú
    k zamysleniu. Hľadáme odpoveď na otázku: Zobrali by sme si svojho partnera po
    dvadsiatich rokoch spoločného života? Účinkujú Soňa Norisová Dominika Žiaranová
    Martin Mňahončák David Hartl Výtvarné riešenie Soňa Sadilková Réžia Vlado Fischer
