- id: evt_20260410_src_kamdomesta_sk_bratislava_zdroj_mdtn_sk_predstavenia_pre_deti_z_mi_kov_pinocchio_a_jeh
  title: 'Zdroj: Mdtn.sk Predstavenia > Pre deti > Z. Mišáková: Pinocchio a jeho divadelný
    sen Nahlásiť podujatie Organizátor neuvedený Zlaté Moravce, MSKS Zlaté Moravce
    Piatok , 17:00 Kúpiť lístok divadelný sen Nová divadelná adaptácia príbehu neposedného
    dreveného chlapca Pinocchia, ktorý sa túži stať skutočným chlapcom. Jeho cesta
    za pravdou je kľukatá a plná nástraha, tak ako je plná aj kamarátov a rád od múdrejších.
    Je len na Pinocchiovi, ako sa rozhodne. Pinocchio zatúži po slobodnom, nezávislom
    divadle, kde by mohol zažívať svoje sny s priateľmi – ostatnými bábkami/hercami.
    Muzikál umeleckou formou hovorí o nastavení hodnotového rebríčka detí a mládeže,
    o dôležitosti vzdelania, pracovitosti, priateľstva, slobody a o vzopretí sa stále
    aktuálnej šikane. Zachováva si pritom rozprávkovú magickosť: prejavuje sa v prostrediach
    divadla, vnútra veľryby, pri stretnutiach s vílou a i. Divadlo v divadle je príležitosťou
    ukázať fungovanie divadelného mikrosveta s jeho umeleckými, ľudskými, ale aj ekonomickými
    vzťahmi. Scénografia v sebe spája detskú hravosť, sýtosť farieb a súčasný štylizovaný
    svetelný dizajn, čo tvorí atraktívny celok pre detského aj dospelého diváka. Pôvodná
    hudba vytvorená pre inscenáciu MDT dotvára atmosféru Pinochiovej cesty za poriadnym
    životom. Divadelné kostýmy vychádzajú z premís historicky prvých profesionálnych
    divadiel na svete, talianskej Commedie dell´arte. Hlavnou ideou inscenácie sa
    stane nekompromisná túžba po slobodnom vyjadrení v umení aj v živote, rešpektovanie
    hodnôt ako vzdelanie, priateľstvo, práca a sloboda. Pinocchio nakoniec pochopí,
    že ak chce byť skutočným človekom, musí sa vzdať svojej sebeckosti a začať myslieť
    na druhých. Námet: Carlo Collodi Autor, kreatívny producent, dramaturgia: Zuzana
