- id: evt_20260329_src_kamdomesta_sk_bratislava_zdroj_8_tis_coviek_port_turistick_v_zva_8_kalv_ri_nahl_si_po
  title: 'Zdroj: 8 TISÍCOVIEK Šport > TURISTICKÁ VÝZVA - 8 KALVÁRIÍ Nahlásiť podujatie
    - 31.03.2026 8 TISÍCOVIEK Bratislava-Staré Mesto, Slovensko Pondelok 30.03.2026,
    12:00 Kúpiť lístok Iné termíny TURISTICKÁ VÝZVA - 8 KALVÁRIÍ Objavte kus našej
    histórie a odmeňte sa tými najnádhernejšími výhľadmi. Patríte k milovníkom turistiky,
    histórie a miest s jedinečnou atmosférou? Hľadáte výzvu, ktorá vás prevedie krásnymi,
    no často prehliadanými kútmi Slovenska? Pridajte sa k výzve 8 KALVÁRIÍ a zažite
    nezabudnuteľnú zimnú a jarnú turistiku. Počas nasledujúcich 4 mesiacov máte skvelú
    príležitosť navštíviť 8 ľubovoľných kalvárií po celom Slovensku. Či už si vyberiete
    rozsiahle barokové komplexy, malé a tiché kalvárie v obciach, alebo tie, ktoré
    sú súčasťou pútnických miest – výber je len na vás! Podmienky sú jednoduché: Absolvujte
    8 kalvárií v priebehu určeného časového obdobia (25.11. – 31.3.2025). Vyberte
    si akékoľvek trasy a miesta na Slovensku. Na každej kalvárii spravte svoju fotku
    – ideálne pri kaplnke, kríži alebo hlavnej bráne, aby bolo miesto jasne identifikovateľné.
    Všetkých 8 fotiek nám potom naraz pošlite na našu e-mailovú adresu: [finiserskevyzvy@gmail.com].
    Podeľte sa s nami o vaše zážitky, o krásu architektúry a úžasné výhľady, ktoré
    kalvárie často ponúkajú. Už teraz sa tešíme na vaše fotky! Čo nájdete v štartovacom
    balíčku? Odznak výzvy: S hrdosťou ukážte, že patríte do super partie turistickej
    výzvy 8 KALVÁRIÍ. Špeciálny darček. Opakovane použiteľný hrejivý vankúšik. Jedinečná
    multifunkčná 3D medaila a diplom: Krásna pamiatka na váš úspech. Možnosť vyhrať
    skvelé ceny v žrebovaní! Portál www.kamdomesta.sk nie je organizátorom uverejňovaných
    podujatí a preto nezodpovedá za zmeny uskutočnené organizátormi. Odporúčame preveriť
    si vopred termín a čas konania podujatia priamo u organizátora. Na niektoré akcie
    je potrebné sa prihlásiť vopred. Miesto konania Ďalšie termíny 29. 03. 2026 Nedeľa
    12:00 - 22:00 Bratislava-Staré Mesto Slovensko 29. 03. Nedeľa 12:00 - 22:00 Bratislava-Staré
