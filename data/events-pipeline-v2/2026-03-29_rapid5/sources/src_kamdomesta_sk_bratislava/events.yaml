- id: evt_20260411_src_kamdomesta_sk_bratislava_zdroj_maxiticket_sk_port_cft_13_nahl_si_podujatie_organiz_to
  title: 'Zdroj: Maxiticket.sk Šport > CFT 13 Nahlásiť podujatie Organizátor neuvedený
    Šamorín, Zápasnícka hala ZK Gladiátor Sobota , 18:00 Kúpiť lístok Champion Fighting
