- id: evt_20260412_src_kamdomesta_sk_bratislava_zdroj_gal_ria_nedbalka_kurzy_z_itkov_ma_ovanie_ma_ujeme_ako_
  title: 'Zdroj: Galéria Nedbalka Kurzy > Zážitkové maľovanie - Maľujeme ako francúzski
    impresionisti Nahlásiť podujatie Galéria Nedbalka Bratislava-Staré Mesto, Galéria
    Nedbalka Nedeľa , 14:00 Kúpiť lístok Ateliér Nedbalka vás pozýva na kreatívne
    popoludnie inšpirované tvorbou francúzskych impresionistov. Pod vedením akademického
    maliara Andreja Augustína si vytvoríte vlastné originálne dielo inšpirované týmto
    umeleckým smerom. Pri práci budeme počúvať francúzske šansóny. Všetko potrebné,
    vrátane malého občerstvenia, je v cene. Termín: sobota 12. 4. 2026 (nedeľa), 14.00
    – 17.00 h Cena: 55€ Andrej Augustín (*1964) Narodil sa v Bratislave a študoval
    na Vysokej škole umeleckého priemyslu v Prahe. Venuje sa maľbe, pastelu, grafike,
    ilustráciám, textilu, maľbe na porcelán a keramiku. Jeho diela príťažlivým spôsobom
    komunikujú so širším publikom, metaforicky znázorňujú meditáciu, baladu a nádej.
    Témou jeho obrazov je často vnútorný život maliara. Čarovná realita sa tak v nich
