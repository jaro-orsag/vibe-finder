    majú právo na základe písomnej žiadosti od spoločnosti vyžadovať: (a) potvrdenie,
    či sú alebo nie sú jeho osobné údaje spracúvané, (b) vo všeobecne zrozumiteľnej
    forme informácie o spracúvaní osobných údajov v informačnom systéme a oboznámiť
    sa s postupom spracúvania a vyhodnocovania operácií, (c) vo všeobecne zrozumiteľnej
    forme presné informácie o zdroji, z ktorého spoločnosť získala jeho osobné údaje
    na spracúvanie, (d) vo všeobecne zrozumiteľnej forme zoznam jeho osobných údajov,
    ktoré sú predmetom spracúvania, (e) opravu alebo likvidáciu jeho nesprávnych,
    neúplných alebo neaktuálnych osobných údajov, ktoré sú predmetom spracúvania,
    (f) likvidáciu jeho osobných údajov, ktorých účel spracúvania sa skončil, (g)
    likvidáciu jeho osobných údajov, ktoré sú predmetom spracúvania, ak došlo k porušeniu
    zákona, (h) blokovanie jeho osobných údajov z dôvodu odvolania súhlasu pred uplynutím
    času jeho platnosti, ak spoločnosť spracúva osobné údaje na základe súhlasu používateľa
