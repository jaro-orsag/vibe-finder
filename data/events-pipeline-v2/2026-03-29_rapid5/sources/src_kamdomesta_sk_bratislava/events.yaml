- id: evt_20180509_src_kamdomesta_sk_bratislava_o_b_c_h_o_d_n_e_j_s_p_o_l_o_n_o_s_t_i_enter_design_s_r_o_zap
  title: 'o b c h o d n e j s p o l o č n o s t i enter design, s.r.o. zapísanej do
    Obchodného registra Okresného súdu Košice I, oddiel Sro, vložka č. 13661/V, IČO
    36217891, DIČ 2020063232 so sídlom Hutnícka 1, 040 01 Košice (ďalej len „spoločnosť“
    v príslušnom gramatickom tvare) platné a účinné pri prevádzkovaní a používaní
    internetovej stránky www.kamdomesta.sk Spoločnosť enter design, s.r.o je vlastníkom
    a prevádzkovateľom internetového portálu www.kamdomesta.sk (ďalej ako „Spoločnosť“)
    a je oprávnená na tomto portáli poskytovať služby, a to reklamný priestor na zverejňovanie
    kultúrnych, spoločenských a športových podujatí organizovaných alebo propagovaných
    používateľom a / alebo zverejnenie informácii o prevádzkach a poskytovaných službách
    podnikateľských subjektov a /alebo realizáciu súťaží. Používateľ je fyzická alebo
    právnická osoba, ktorá zverejnené podujatie organizuje alebo je oprávnená na jeho
    propagáciu, je vlastníkom alebo je oprávnená na propagáciu prevádzok poskytujúcich
    služieb. 1. ÚVODNÉ USTANOVENIA 1.1 Tieto všeobecné obchodné podmienky podrobne
    upravujú rámec právneho vzťahu medzi spoločnosťou a návštevníkom vznikajúceho
    pri prehliadaní obsahu internetovej stránky a rámec právneho vzťahu medzi spoločnosťou
    a používateľom vznikajúceho pri využívaní služby používateľom. Návštevník a používateľ
    sú viazaní pravidlami upravenými týmito všeobecnými obchodnými podmienkami od
    okamihu nadobudnutia postavenia návštevníka a/alebo používateľa. 1.2 Právne vzťahy
    neupravené týmito všeobecnými obchodnými podmienkami sa spravujú príslušnými všeobecne
    záväznými právnymi predpismi platnými a účinnými na území Slovenskej republiky,
    a to najmä zákonom č. 513/1991 Zb. Obchodný zákonník v znení neskorších predpisov,
    a to aj v prípade, že návštevník alebo používateľ sú podnikateľské subjekty registrované
    v zahraničí alebo ide o fyzické osoby, ktoré sú občanmi iných štátov ako je Slovenská
    republika. 1.3 Internetová stránka je pre účely týchto všeobecných obchodných
    podmienok internetová stránka, ktorej obsah sa návštevníkom a používateľom zobrazí
    v štandardnom internetovom prehliadači po zadaní adresy domény v znení www.kamdomesta.sk.
    Pre vylúčenie akýchkoľvek pochybností sa ustanovuje, že pod internetovou stránkou
    sa pre účely týchto všeobecných obchodných podmienok rozumie každá internetová
    stránka identifikovaná cez adresu subdomén k doméne www.kamdomesta.sk. Spoločnosť
    je oprávnená na základe osobitného právneho vzťahu užívať doménu www.kamdomesta.sk
    a jej subdomény. 1.4 Obsah internetovej stránky je všetok grafický, textový alebo
    iný obsah, ktorý sa návštevníkovi a/alebo používateľovi zobrazí pri prehliadaní
    internetovej stránky a/alebo pri využívaní služby okrem obsahu používateľa. Spoločnosť
    vykonáva všetky majetkové práva autorov alebo iných osôb, ktoré sa svojou tvorivou
    duševnou činnosťou podieľali na jeho vytvorení a má zároveň všetky práva k obsahu
    internetovej stránky, ktorý nie je ako predmet ochrany chránený právom tretej
    osoby z oblasti práva duševného vlastníctva. Pre vylúčenie pochybností sa ustanovuje,
    že obsahom internetovej stránky je všetok software, ktorý má možnosť návštevník
    pri prezeraní internetovej stránky a/alebo používateľ pri využívaní služby používať.
    Vždy, keď sa v týchto obchodných podmienkach použije pojem obsah internetovej
    stránky, myslí sa tým obsah internetovej stránky ako celok a zároveň každá jeho
    časť, ak nie je v týchto obchodných podmienkach ustanovené inak. Bez predchádzajúceho
    súhlasu spoločnosti nemá návštevník ani používateľ právo obsah internetovej stránky
    alebo ktorúkoľvek jeho časť použiť. 1.5 Obsah používateľa je pre účely týchto
    všeobecných obchodných podmienok dátový alebo iný obsah vytvorený používateľom
    prostredníctvom osobitného programového prostredia internetovej stránky, a to
    prostredníctvom používateľského účtu, a uložený na úložisko dát určené spoločnosťou
    pri využívaní služby. Obsah používateľa je obsahom internetovej stránky s tým,
    že je majetkom používateľa a za súlad obsahu používateľa s príslušnými všeobecne
    záväznými právnymi predpismi platnými a účinnými na území Slovenskej republiky
    zodpovedá v plnom rozsahu používateľ. 1.6 Návštevník je pre účely týchto všeobecných
    obchodných podmienok fyzická alebo právnická osoba, ktorá si v prostredí štandardného
    internetového prehliadača zadá do príkazového riadku adresu domény www.kamdomesta.sk
    alebo adresu niektorej zo subdomén domény www.kamdomesta.sk a dôjde k zobrazeniu
    obsahu internetovej stránky alebo dôjde k jej presmerovaniu na obsah internetovej
    stránky z prostredia internetových vyhľadávacích služieb alebo z inej internetovej
    stránky a zobrazí sa obsah internetovej stránky. 1.7 Používateľ je právnická alebo
    fyzická osoba oprávnená na podnikanie podľa osobitného predpisu, ktorá pravdivo
    a úplne vyplnila registračný formulár a zaregistrovala sa pre užívanie služby
    poskytovanej spoločnosťou s využitím internetovej stránky. V prípade, že si používateľ
    iba prezerá internetovú stránku a nevyužíva službu, považuje sa za návštevníka.
    1.8 Používateľský účet je pracovné prostredie používateľa, ku ktorému získa používateľ
    prístup po vykonaní registrácie a ktorý slúži na využívanie služby používateľom.
    Prístup ku každému používateľskému účtu bude definovaný unikátnym spojením prihlasovacieho
    mena a hesla viažuceho sa k prihlasovaciemu menu alebo bude založený na autentifikácií
    treťou stranou (zjednodušené prihlasovanie najmä spoločnosti Google alebo Facebook
    alebo cez služby SMS brány). Povinnou súčasťou úspešného vytvorenia používateľského
    účtu je vyjadrenie súhlasu s týmito všeobecnými obchodnými podmienkami spoločnosti.
    1.9 Služba je pre účely týchto všeobecných obchodných podmienok služba zverejňovania
    kultúrnych, spoločenských a športových podujatí organizovaných používateľom, zverejnenie
    informácii o prevádzkach a poskytovaných službách podnikateľských subjektov v
    rozsahu podľa ponuky sprístupnenej verejnosti na internetovej stránke a určenej
    spoločnosťou. Službu poskytuje spoločnosť odplatne, a to za ceny podľa aktuálneho
    cenníka sprístupneného verejnosti prostredníctvom internetovej stránky. Spoločnosť
    si vyhradzuje právo poskytovať službu počas spoločnosťou určeného obdobia bezodplatne
    alebo za cenu zníženú o spoločnosťou určenú sumu. Súčasťou služby je aj uchovávanie
    záznamov a informácií, ktoré používateľ zadá do služby. Toto uchovávanie záznamov
    nemá charakter archivácie dokladov používateľa v súlade so zákonom č. 395/2002
    Z. z. o archívoch a registratúrach v znení neskorších predpisov. Spoločnosť si
    zároveň vyhradzuje právo informovať používateľa o stave predplatenia služby. 1.10
    Spoločnosť je obchodnou spoločnosťou založenou, vzniknutou a zapísanou v príslušných
    registroch v súlade s príslušnými všeobecne záväznými právnymi predpismi platnými
    a účinnými na území Slovenskej republiky a je oprávnená uskutočňovať podnikateľskú
    činnosť tak, aby mohla byť prevádzkovateľom internetovej stránky a zároveň poskytovateľom
    služby. 1.11 Technické zariadenie je zariadenie obsahujúce hardwareové a softwareové
    vybavenie umožňujúce pripojenie sa k internetovej stránke v prostredí elektronickej
    komunikačnej siete internet, prezeranie obsahu internetovej stránky a využívanie
    služby, najmä osobný počítač a/alebo notebook a/alebo tablet a/alebo smartphone.
    Technické zariadenie nemusí byť vo vlastníctve návštevníka a/alebo používateľa.
    Za jeho použitie v súvislosti s prezeraním internetovej stránky a/alebo využitím
    služby zodpovedá výlučne návštevník a/alebo používateľ. 2. PRAVIDLÁ PRE PREZERANIE
    INTERNETOVEJ STRÁNKY 2.1 Návštevník má právo prezerať si obsah internetovej stránky
    s využitím technického zariadenia. 2.2 Návštevník je povinný pri prezeraní internetovej
    stránky a akejkoľvek časti obsahu internetovej stránky postupovať takým spôsobom,
    aby svojim konaním nezasahoval do práv spoločnosti a/alebo iných návštevníkov
    a/alebo používateľov a/alebo tretích osôb. 2.3 Návštevník nesmie z prostredia
    internetovej stránky vykonať download (tzv. stiahnutie) obsahu internetovej stránky
    alebo akejkoľvek jeho časti do technického zariadenia nad rámec obsahu internetovej
    stránky určeného spoločnosťou na stiahnutie do technického zariadenia, ani si
    z obsahu internetovej stránky vyhotovovať žiaden obrazový a/alebo zvukový a/alebo
    zvukovoobrazový záznam. V prípade, že návštevník tieto svoje povinnosti poruší,
    zodpovedá za všetku škodu, ktorá vznikne spoločnosti a/alebo iným návštevníkom
    a/alebo iným používateľom a/alebo tretím osobám. 2.4 Návštevník má právo vykonať
    download tej časti obsahu internetovej stránky, ktorú pre tento účel určí spoločnosť
    s tým, že pri tomto postupe je povinný dodržať pokyny spoločnosti. V prípade nedodržania
    pokynov spoločnosti zaniká akékoľvek právo návštevníka na náhradu prípadnej škody.
    2.5 V prípade, že je obsahom internetovej stránky priestor pre vyjadrenie názoru
    alebo iného vyjadrenia návštevníka ku konkrétnej skutočnosti, návštevník je rovnako
    povinný postupovať podľa ustanovenia čl. II ods. 2.2 týchto všeobecných obchodných
    podmienok. V prípade, že bude možné takýto zásah predpokladať, spoločnosť si vyhradzuje
    jednostranne právo takýto názor z obsahu internetovej stránky odstrániť. Pre vylúčenie
    pochybností sa ustanovuje, že spoločnosť nezodpovedá za akýkoľvek názor zobrazený
    prostredníctvom internetovej stránky; za obsah názoru alebo iného vyjadrenia a
    prípadné porušenie všeobecne záväzných právnych predpisov platných a účinných
    na území Slovenskej republiky zodpovedá samostatne návštevník. 3. REGISTRÁCIA
    A UVEREJŇOVANIE PODUJATÍ 3.1 V prípade, že používateľ má záujem využívať službu,
    je povinný vykonať registráciu prostredníctvom registračného formulára sprístupneného
    prostredníctvom internetovej stránky. 3.2 Používateľ je povinný uviesť v registračnom
    formulári všetky povinné údaje v rozsahu určenom spoločnosťou s tým, že je zároveň
    povinný uviesť údaje, ktoré sú správne, presné a pravdivé. V prípade, že v registračnom
    formulári používateľ uvedie nesprávne a/alebo nepresné a/alebo nepravdivé údaje
    a bude na základe týchto údajov neoprávnene požívať postavenie používateľa, čoho
    dôsledkom bude vznik škody na majetku spoločnosti a/alebo iných návštevníkov a/alebo
    iných používateľov a/alebo tretích osôb, používateľ zodpovedá za všetku spôsobenú
    škodu samostatne bez účasti spoločnosti. 3.3 Okamihom odoslania registračného
    formulára obsahujúceho všetky povinné údaje a zároveň obsahujúceho údaje správne,
    presné a pravdivé (ďalej len „riadne vyplnený formulár“ v príslušnom gramatickom
    tvare) návštevník získava postavenie používateľa. Podmienkou pre odoslanie registračného
    formulára je vyjadrenie výslovného súhlasu s týmito všeobecnými obchodnými podmienkami
    zaškrtnutím príslušného políčka, tzv. „check boxu“. 3.4 Na základe predpokladu
    riadne vyplneného formulára spoločnosť zriadi používateľovi používateľský účet,
    ktorý je používateľ oprávnený používať pri využívaní služby a odošle používateľovi
    spôsobom a vo forme podľa určenia spoločnosti prístupové údaje, ak budú generované
    spoločnosťou; ak spoločnosťou uvedené prihlasovacie údaje generované nebudú, platia
    ako prihlasovacie údaje prihlasovacie meno a heslo určené používateľom. 3.5 Používateľský
    účet je oprávnený používať len používateľ, teda osoba, ktorá vyplnila a odoslala
    spoločnosti riadne vyplnený formulár. Ak používateľ odovzdá prihlasovacie údaje
    do svojho používateľského účtu tretej osobe, nesie samostatne a bez účasti spoločnosti
    následky za prípadné škody, ktoré mu a/alebo spoločnosti a/alebo inému používateľovi
    a/alebo návštevníkovi a/alebo tretej osobe v súvislosti s užívaním služby treťou
    osobou vzniknú. 3.6 V prípade, že spoločnosť zistí, že je odôvodnene možné predpokladať,
    že odoslaný registračný formulár nie je riadne vyplneným formulárom (napríklad
    uvedenie nesprávnych, nepravdivých alebo neaktuálnych údajov), spoločnosť si vyhradzuje
    právo jednostranného zrušenia používateľského účtu a nenávratného odstránenia
    celého obsahu používateľa jeho vymazaním z úložiska dát. Spoločnosť v takomto
    prípade nezodpovedá za prípadnú vzniknutú škodu osobe, ktorá odoslala spoločnosti
    registračný formulár bez toho, aby spĺňal parametre riadne vyplneného formulára.
    3.7 Každý z používateľov má právo registrovať sa iba raz a využívať službu prostredníctvom
    jediného používateľského účtu; každý používateľský účet je viazaný na jedno unikátne
