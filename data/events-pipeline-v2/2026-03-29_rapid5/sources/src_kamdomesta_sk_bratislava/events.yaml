- id: evt_20260329_src_kamdomesta_sk_bratislava_zdroj_organiz_tor_in_akcie_ve_k_itate_sk_v_zva_2026_pre_tajt
  title: 'Zdroj: organizátor Iné akcie > Veľká čitateľská výzva 2026: Prečítajte s
    nami 12 kníh za rok! Nahlásiť podujatie - 31.12.2026 Verejná knižnica Mikuláša
    Kováča Banská Bystrica, Verejná knižnica Mikuláša Kováča - Pobočka Fončorda Nedeľa
    , 08:00 Iné termíny Verejná knižnica Mikuláša Kováča vyhlasuje nový ročník obľúbenej
    čitateľskej výzvy. Nezáleží na tom, či ste vášnivý knihomoľ alebo hľadáte motiváciu
    k pravidelnému čítaniu – naša výzva je otvorená pre všetky vekové kategórie od
    8 do 80+ rokov. Zapojte sa do celoročného dobrodružstva, objavte nové literárne
    žánre a vyhrajte zaujímavé ceny! Cieľom je prečítať 12 kníh počas 12 mesiacov.
    Každý mesiac je zameraný na inú tému, ktorú sme pre vás starostlivo vybrali. Výzva
    má dve kategórie s prispôsobenými témami: Kategória DETI (hravé témy podporujúce
    fantáziu). Kategória DOSPELÍ (rozmanité žánre a čitateľské lahôdky). Ako sa zapojiť?
    1. Získajte leták: Zastavte sa v ktorejkoľvek pobočke Verejnej knižnice Mikuláša
    Kováča a vyzdvihnite si leták s témami výzvy. 2. Hracia karta pre deti: Malí čitatelia
    dostanú špeciálnu hraciu kartu, do ktorej pri každej mesačnej návšteve a splnenej
    výzve získajú pečiatku. 3. Zapisovanie prečítaných kníh: Dospelí aj deti si do
    letáku priebežne zaznamenávajú autorov a názvy prečítaných diel k príslušným témam.
    4. Odovzdanie: Vyplnený leták (alebo jeho sken/fotku) doručte najneskôr do 15.
    januára 2027: osobne v ktorejkoľvek pobočke knižnice, alebo e-mailom na adresu:
    marketing@vkmk.sk. Všetci účastníci, ktorí úspešne splnia podmienky a odovzdajú
    leták v termíne, získajú hodnotný darček (knižné prekvapenie, sladkosti a iné
    vecné ceny). Stretnutie zapojených do výzvy a odovzdávanie odmien prebehne začiatkom
    marca 2027 počas celoslovenského podujatia Týždeň slovenských knižníc. Viac info
    a okruhy: https://www.vkmk.sk/oznamy/velka-citatelska-vyzva-2026--precitajte-s-nami-12-knih-za-rok-.html
    Portál www.kamdomesta.sk nie je organizátorom uverejňovaných podujatí a preto
    nezodpovedá za zmeny uskutočnené organizátormi. Odporúčame preveriť si vopred
    termín a čas konania podujatia priamo u organizátora. Na niektoré akcie je potrebné
    sa prihlásiť vopred. Miesto konania Ďalšie termíny 29. 03. 2026 Nedeľa 08:00 -
    23:59 Banská Bystrica Verejná knižnica Mikuláša Kováča - Pobočka Fončorda 29.
